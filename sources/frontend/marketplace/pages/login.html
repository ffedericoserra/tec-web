<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/artaround/logo.png" />
    <title data-i18n="login.title">ArtAround - Accesso</title>
    <link rel="stylesheet" href="../stylesheets/navbar.css" />
    <link rel="stylesheet" href="../stylesheets/login.css" />
    <link rel="stylesheet" href="../stylesheets/responsive.css" />
  </head>
  <body id="artaround-login" class="login-body">
    <header class="top-nav editorial-nav"><div class="nav-wrapper"></div></header>

    <main class="login-page-shell">
      <section class="login-hero">
        <div class="page-grid-lines">
          <div class="grid-line line-25"></div>
          <div class="grid-line line-50"></div>
          <div class="grid-line line-75"></div>
        </div>

        <div class="shape-circle circle-small"></div>
        <div class="shape-circle circle-large"></div>

        <div class="login-layout">
          <section class="login-heading-block">
            <span class="login-kicker" data-i18n="login.kicker">Accesso personale</span>
            <h1 class="login-title">
              <span class="font-light">ART</span><br />
              <span class="burgundy-text">AROUND</span>
            </h1>
            <p class="login-copy" data-i18n="login.copy">
              Accedi per creare visite, salvare tour e gestire la tua esperienza
              museale.
            </p>
          </section>

          <section class="login-panel" aria-labelledby="login-panel-title">
            <div class="login-panel-header">
              <span class="text-label" data-i18n="common.account">Account</span>
              <h2 id="login-panel-title" data-i18n="login.submit">Accedi</h2>
            </div>

            <form id="login-form" class="login-form">
              <div class="input-group">
                <label for="login-username" class="text-label" data-i18n="login.usernameOrEmail"
                  >Username o email</label
                >
                <input
                  id="login-username"
                  class="input-slot"
                  name="username"
                  type="text"
                  autocomplete="username"
                  required
                />
              </div>

              <div class="input-group">
                <label for="login-password" class="text-label" data-i18n="common.password">Password</label>
                <div class="password-field">
                  <input
                    id="login-password"
                    class="input-slot"
                    name="pwd"
                    type="password"
                    autocomplete="current-password"
                    required
                  />
                  <button
                    class="password-toggle"
                    type="button"
                    data-password-visibility-toggle
                    aria-label="Mostra password"
                    data-i18n-aria-label="common.showPassword"
                    aria-pressed="false"
                  >
                    <img src="../assets/artaround/closed-eye-icon.png" alt="" aria-hidden="true" />
                  </button>
                </div>
              </div>

              <button class="main-btn" type="submit" data-i18n="login.submit">Accedi</button>

              <div id="error-msg" class="login-error" aria-live="polite"></div>
            </form>

            <p class="register-prompt">
              <span data-i18n="login.noAccount">Non hai un account?</span>
              <a href="register.html" data-i18n="login.createHere">Creane uno qui</a>
            </p>
          </section>
        </div>
      </section>
    </main>

    <script src="../vendor/i18next.min.js"></script>
    <script src="../scripts/i18n.js"></script>
    <script src="../scripts/navbar.js"></script>
    <script src="../scripts/login.js"></script>
  </body>
</html>
