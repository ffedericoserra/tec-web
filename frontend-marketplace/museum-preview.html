<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main-container">
      <header class="top-bar">
        <span class="about-text">Add a new museum</span>
        <button class="add-btn">+</button>
      </header>

      <main class="center-content">
        <h1 class="title">Marketplace</h1>
        <h2 class="subtitle">Select an existing museum or add a new one</h2>
        <div id="museum-list"></div>
      </main>

      <footer class="bottom-bar"></footer>
    </div>
    <div id="add-museum-modal" class="modal-overlay hidden">
      <div class="modal-content auth-form">
        <h2 class="subtitle" style="margin-top: 0; color: var(--blue)">
          Add New Museum
        </h2>
        <form id="add-museum-form">
          <div class="input-group">
            <label for="m-name">Museum Name *</label>
            <input type="text" id="m-name" required />
          </div>
          <div class="input-group">
            <label for="m-address">Address</label>
            <input type="text" id="m-address" />
          </div>
          <div class="input-group">
            <label for="m-description">Description</label>
            <textarea
              id="m-description"
              rows="3"
              style="
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ccc;
                font-family: inherit;
                resize: vertical;
              "
            ></textarea>
          </div>

          <div id="add-modal-error" class="error-message"></div>

          <div style="display: flex; gap: 10px; margin-top: 10px">
            <button
              type="button"
              class="login-btn"
              id="cancel-add-btn"
              style="
                flex: 1;
                padding: 10px;
                border-color: #d9534f;
                color: #d9534f;
              "
            >
              Cancel
            </button>
            <button
              type="submit"
              class="login-btn"
              style="flex: 1; padding: 10px"
            >
              Save
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="museum-preview.js"></script>
  </body>
</html>
