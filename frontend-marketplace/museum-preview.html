<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main-container">
      <header class="top-bar">
        <a href="homepage.html" class="logo-link">
          <img
            src="../imgs/artaround/logo.png"
            alt="ArtAround Logo"
            class="logo-img"
          />
        </a>

        <div style="display: flex; align-items: center; gap: 15px">
          <span class="about-text" style="margin: 0">Add a new museum</span>
          <button class="add-btn">+</button>
        </div>
      </header>

      <main class="center-content">
        <h1 class="title">Marketplace</h1>
        <h2 class="subtitle">Select an existing museum or add a new one</h2>
        <div class="search-container">
          <input
            type="text"
            id="search-bar"
            class="input-slot search-bar-input"
            placeholder="Search for a museum or a city..."
          />
        </div>
        <div id="museum-list"></div>
      </main>

      <footer class="bottom-bar"></footer>
    </div>
    <div id="add-museum-modal" class="modal-overlay hidden">
      <div class="modal-content auth-form">
        <h2 class="subtitle" style="margin-top: 0; color: var(--blue)">
          Add New Museum
        </h2>
        <form id="add-museum-form">
          <div class="input-group">
            <label for="m-name">Museum Name *</label>
            <input type="text" id="m-name" required />
          </div>
          <div class="input-group">
            <label for="m-address">Address</label>
            <input type="text" id="m-address" />
          </div>
          <div class="input-group">
            <label for="m-description">Description</label>
            <textarea
              id="m-description"
              rows="3"
              style="
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ccc;
                font-family: inherit;
                resize: vertical;
              "
            ></textarea>
          </div>

          <div id="add-modal-error" class="error-message"></div>

          <div class="form-actions">
            <button
              type="button"
              class="main-btn cancel-btn"
              id="cancel-add-btn"
            >
              Cancel
            </button>
            <button type="submit" class="main-btn">Save</button>
          </div>
        </form>
      </div>
    </div>
    <script src="museum-preview.js"></script>
  </body>
</html>
