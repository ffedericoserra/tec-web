<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main-container">
      <header class="top-bar">
        <a href="/navigator" class="nav-link">Go to Navigator</a>
      </header>

      <main class="center-content">
        <h1 class="title">ArtAround</h1>
        <h2 class="subtitle">Hompage</h2>
        <button
          class="login-btn"
          onclick="window.location.href = './loginpage.html'"
        >
          Login
        </button>
      </main>

      <footer class="bottom-bar">
        <div class="about-text">About</div>
        <div class="arrow" id="about-arrow">&darr;</div>
      </footer>
    </div>

    <div class="empty-container">    </div>
    <p class="hidden-text" name="fragment1">ArtAround is a TW project made by Mazzetti Matteo, Serra Federico e Ziccone Andrea</p>

    <script>
      var arrow=document.getElementById("about-arrow")
      arrow.onclick=()=>{
        document.body.style.overflow="auto"
        var target=document.getElementsByClassName("hidden-text")
        target.scrollIntoView({ //gives an error---------------------------------!!!
          behavior: "smooth"
        })
        window.location.href="./homepage.html#fragment1" // fai si che anche l'utente scrolli giù
      }
      
    </script>
  
  </body>

</html>
