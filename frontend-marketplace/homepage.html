<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main-container">
      <header class="top-bar">
        <a href="homepage.html" class="logo-link">
          <img
            src="../imgs/artaround/logo.png"
            alt="ArtAround Logo"
            class="logo-img"
          />
        </a>
      </header>

      <main class="center-content">
        <h1 class="title">ArtAround</h1>
        <h2 class="subtitle">Homepage</h2>

        <div
          style="
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
          "
        >
          <button
            class="login-btn"
            onclick="window.location.href = './loginpage.html'"
          >
            Login
          </button>
          <button
            class="register-btn"
            onclick="window.location.href = './registerpage.html'"
          >
            Sign up
          </button>
        </div>
      </main>

      <footer class="bottom-bar">
        <div class="about-text">About</div>
        <div class="arrow" id="about-arrow">&darr;</div>
      </footer>
    </div>

    <div class="empty-container"></div>
    <p class="hidden-text">
      ArtAround is a TW project made by Mazzetti Matteo, Serra Federico e
      Ziccone Andrea
    </p>

    <script>
      var arrow = document.getElementById("about-arrow");

      arrow.onclick = () => {
        document.body.style.overflow = "auto";

        var target = document.querySelector(".hidden-text");

        target.style.display = "block";

        target.scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
      };
    </script>
  </body>
</html>
