<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround — Museum</title>
    <link rel="stylesheet" href="/marketplace/css/base.css" />
    <link rel="stylesheet" href="/marketplace/css/museum.css" />
  </head>
  <body>
    <header class="app-header">
      <a href="/marketplace/museums" class="brand-link">
        <div class="brand">ArtAround &nbsp;|&nbsp; Marketplace &amp; Editor</div>
      </a>

      <div class="profile" id="profile">
        <button class="profile-btn" id="profileBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Profile menu">
          <span class="profile-avatar" id="profileAvatar"></span>
        </button>
        <div class="profile-menu" id="profileMenu" role="menu" hidden>
          <div class="profile-username" id="profileUsername">—</div>
          <button class="profile-logout" id="logoutBtn" type="button" role="menuitem">Logout</button>
        </div>
      </div>
    </header>

    <main class="page">
      <h1 class="museum-name" id="museumName">…</h1>

      <p class="banner" id="errorBanner" hidden></p>

      <nav class="museum-tabs" role="tablist" aria-label="Museum sections">
        <button class="m-tab is-active" data-tab="my-visits" role="tab" type="button" aria-selected="true">My Visits</button>
        <button class="m-tab" data-tab="add-items" role="tab" type="button">Add Items</button>
        <a href="/marketplace/museums" class="change-museum">Change Museum</a>
      </nav>

      <!-- My Visits panel -->
      <section class="panel my-visits-panel" data-panel="my-visits">
        <div class="visit-editor-wrap">
          <div class="visit-editor" id="visitEditor"></div>
          <div class="visit-actions" id="visitActions" hidden>
            <button type="button" class="btn-publish" id="publishBtn" disabled>Publish</button>
          </div>
        </div>

        <aside class="content-picker">
          <input type="search" id="contentPickerSearch" placeholder="Search Item / Artwork / Author …" autocomplete="off" />
          <div class="content-picker-list" id="contentPickerList"></div>
        </aside>
      </section>

      <!-- Add Items panel -->
      <section class="panel add-items-panel" data-panel="add-items" hidden>
        <input type="search" id="addItemsSearch" placeholder="Search" autocomplete="off" />
        <div class="content-grid" id="contentGrid"></div>
      </section>
    </main>

    <!-- Content chooser dialog (open via content-picker `+`) -->
    <dialog id="contentChooserDialog" class="chooser-dialog">
      <div class="chooser-body">
        <div class="chooser-head">
          <h3 id="chooserTitle">Add an item</h3>
          <button type="button" class="chooser-close" id="chooserCloseBtn" aria-label="Close">×</button>
        </div>

        <button type="button" class="chooser-create" id="chooserCreateBtn" disabled
          title="Coming soon — Create Item form is Phase 3">
          + Create New Item
        </button>

        <section class="chooser-section">
          <h4>From your collection</h4>
          <div class="chooser-list" id="chooserMineList"></div>
        </section>

        <section class="chooser-section">
          <h4>From the marketplace</h4>
          <div class="chooser-list" id="chooserMarketList"></div>
        </section>

        <p class="chooser-error" id="chooserError" role="alert"></p>
      </div>
    </dialog>

    <!-- Visit form dialog (shared by New Visit + Edit Visit Info) -->
    <dialog id="visitDialog" class="visit-dialog">
      <form id="visitForm" class="visit-form" novalidate>
        <h3 id="visitDialogTitle">New Visit</h3>

        <label>
          Title
          <input type="text" name="title" required minlength="3" maxlength="120" />
        </label>

        <label>
          Description
          <textarea name="description" rows="3" maxlength="500" placeholder="What is this visit about?"></textarea>
        </label>

        <label>
          Length
          <select name="length">
            <option value="quick">Quick</option>
            <option value="normal" selected>Normal</option>
            <option value="deep">Deep</option>
          </select>
        </label>

        <label class="visit-form-public">
          <input type="checkbox" name="isPublic" checked />
          Public — discoverable in the marketplace
        </label>

        <p class="visit-form-error" id="visitFormError" role="alert"></p>

        <div class="visit-form-actions">
          <button type="button" class="btn-danger" id="visitDeleteBtn" hidden>Delete</button>
          <span class="spacer"></span>
          <button type="button" class="btn-ghost" id="visitCancelBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="visitSaveBtn">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/marketplace/js/museum.js"></script>
  </body>
</html>
