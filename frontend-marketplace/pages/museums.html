<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround — Museums</title>
    <link rel="stylesheet" href="/marketplace-fede-old/css/base.css" />
    <link rel="stylesheet" href="/marketplace-fede-old/css/museums.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">ArtAround &nbsp;|&nbsp; Marketplace &amp; Editor</div>

      <div class="profile" id="profile">
        <button class="profile-btn" id="profileBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Profile menu">
          <span class="profile-avatar" id="profileAvatar"></span>
        </button>
        <div class="profile-menu" id="profileMenu" role="menu" hidden>
          <div class="profile-username" id="profileUsername">—</div>
          <button class="profile-logout" id="logoutBtn" type="button" role="menuitem">Logout</button>
        </div>
      </div>
    </header>

    <main class="page">
      <nav class="tabs" role="tablist" aria-label="Museum view">
        <button class="tab" data-tab="saved" role="tab" type="button">Saved Museums</button>
        <button class="tab is-active" data-tab="all" role="tab" type="button" aria-selected="true">All Museums</button>
      </nav>

      <div class="search-row">
        <input type="search" id="search" placeholder="Search" autocomplete="off" aria-label="Search museums" />
      </div>

      <p class="status" id="status">Loading museums…</p>

      <div class="grid" id="grid" hidden></div>
    </main>

    <script type="module" src="/marketplace-fede-old/js/museums.js"></script>
  </body>
</html>
