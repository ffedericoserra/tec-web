<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Visit Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main-container">
      <header class="top-bar space-between">
        <a href="homepage.html" class="logo-link">
          <img
            src="../imgs/artaround/logo.png"
            alt="ArtAround Logo"
            class="logo-img"
          />
        </a>
        <button
          onclick="window.location.href = 'museum-preview.html'"
          class="secondary-btn header-back-btn"
        >
          Torna al Marketplace
        </button>
      </header>

      <main class="visit-main-content">
        <div class="visit-editor-wrapper">
          <h2 class="title editor-title">Costruttore Visita</h2>
          <h3 class="editor-subtitle">
            Stai creando una visita per:
            <strong id="display-museum-name" class="highlight-museum"
              >...</strong
            >
          </h3>

          <div class="visit-meta-form">
            <div>
              <input
                type="text"
                id="v-title"
                placeholder="Es. Capolavori del Rinascimento (Titolo Visita)..."
                required
              />
            </div>
            <div>
              <textarea
                id="v-desc"
                rows="2"
                placeholder="Descrizione o introduzione generale alla visita..."
              ></textarea>
            </div>
          </div>

          <div class="blocks-wrapper" id="blocks-container">
            <div class="add-section-wrapper" id="add-block-btn">
              <div class="add-section-content">
                <button class="add-btn">+</button>
                <span class="add-section-text">Aggiungi Sezione</span>
              </div>
            </div>
          </div>

          <div class="action-buttons">
            <button id="cancel-btn" class="main-btn cancel-visit-btn">
              Annulla / Esci
            </button>
            <button id="save-visit-btn" class="main-btn save-visit-btn">
              Salva nel Database
            </button>
          </div>
        </div>
      </main>
    </div>

    <div id="select-item-modal" class="modal-overlay hidden">
      <div class="modal-content auth-form">
        <h3 class="subtitle modal-top-title">Scegli un'opera</h3>
        <div id="items-container" class="items-scroll-container"></div>
        <button
          type="button"
          class="main-btn close-modal-btn"
          id="close-item-modal"
        >
          Chiudi
        </button>
      </div>
    </div>

    <div id="cancel-confirm-modal" class="modal-overlay hidden">
      <div class="modal-content auth-form center-text-modal">
        <h2 class="warning-title">Attenzione!</h2>
        <p class="warning-text">
          Stai per uscire dall'editor. Le modifiche non salvate andranno perse.
          Vuoi salvare la visita prima di abbandonare la pagina?
        </p>
        <div class="modal-action-stack">
          <button id="confirm-save-btn" class="main-btn confirm-save-btn">
            Salva Visita
          </button>
          <button id="confirm-exit-btn" class="main-btn confirm-exit-btn">
            Esci senza salvare
          </button>
          <button id="close-cancel-modal" class="main-btn continue-edit-btn">
            Continua a modificare
          </button>
        </div>
      </div>
    </div>

    <script src="create-visit.js"></script>
  </body>
</html>
