<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtAround - Visit Builder</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* === LAYOUT GENERALE ALLARGATO === */
        .visit-editor-wrapper {
            width: 100%; max-width: 1400px; margin: 20px auto; padding: 30px;
            background: #ffffff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); position: relative;
        }

        /* === METADATI VISITA === */
        .visit-meta-form {
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #e2e8f0;
        }
        .visit-meta-form input, .visit-meta-form textarea {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 1.1rem;
        }
        .visit-meta-form input:focus, .visit-meta-form textarea:focus {
            outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(45, 62, 80, 0.1);
        }

        /* === STILE ARCHIDEKT: COLONNE ORIZZONTALI === */
        .blocks-wrapper {
            display: flex; gap: 20px; overflow-x: auto; padding: 10px 10px 40px 10px; align-items: flex-start; min-height: 400px;
        }

        .visit-block {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px;
            min-width: 320px; width: 320px; display: flex; flex-direction: column; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); flex-shrink: 0;
        }

        .block-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .block-number {
            background: var(--blue); color: white; min-width: 28px; height: 28px;
            border-radius: 6px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1rem;
        }
        .block-title-input {
            flex: 1; font-size: 1.2rem; font-weight: bold; border: none; width: 100%; text-align: center;
            background: transparent; border-bottom: 2px solid transparent; color: var(--charcoal);
        }
        .block-title-input:focus { outline: none; border-bottom: 2px solid var(--blue); }
        .block-count { color: #64748b; font-size: 0.85rem; font-weight: bold; background: #e2e8f0; padding: 3px 8px; border-radius: 20px; }
        .delete-block-btn { background: none; border: none; color: #ef4444; font-size: 1.2rem; cursor: pointer; padding: 5px; opacity: 0.5; }
        .delete-block-btn:hover { opacity: 1; }

        /* === LA MAGIA DELLE CARTE IMPILATE === */
        .block-list {
            list-style: none; padding: 0; min-height: 150px; flex-grow: 1; padding-bottom: 30px;
        }
        
        .draggable-item {
            background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
            margin-bottom: -15px; /* Sovrapposizione stile mazzo */
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; z-index: 1; cursor: pointer; /* Pointer perché ora è un link */
            box-shadow: 0 -2px 6px rgba(0,0,0,0.04);
        }
        
        /* HOVER: Solo la carta toccata si solleva e si espande */
        .draggable-item:hover, .draggable-item.dragging {
            margin-bottom: 20px; transform: translateY(-8px); z-index: 10;
            box-shadow: 0 12px 25px rgba(0,0,0,0.15); border-color: #94a3b8;
        }
        
        /* MAGIA CSS: L'ultima carta è espansa SOLO se il mouse NON è sopra la colonna */
        .block-list:not(:hover) .draggable-item.is-last-item {
            margin-bottom: 10px;
            z-index: 5;
        }
        .block-list:not(:hover) .draggable-item.is-last-item .card-details {
            max-height: 200px; padding: 15px; opacity: 1; border-top: 1px solid #f1f5f9;
        }

        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 15px; background: #ffffff; border-radius: 8px; position: relative; z-index: 2;
        }
        
        .card-details {
            max-height: 0; opacity: 0; padding: 0 15px; background: #f8fafc; display: flex; gap: 15px;
            transition: all 0.3s ease; overflow: hidden;
        }

        /* ESPANSIONE DETTAGLI su Hover della carta */
        .draggable-item:hover .card-details { 
            max-height: 200px; padding: 15px; opacity: 1; border-top: 1px solid #f1f5f9; 
        }

        /* Il cursore cambia solo per le maniglie di trascinamento */
        .drag-handle { color: #cbd5e1; font-size: 1.2rem; padding-right: 8px; cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        
        .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; padding: 5px; }
        .card-image-placeholder { width: 60px; height: 60px; background-color: #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.7rem; font-weight: bold; }

        /* === PLACEHOLDER DRAG & DROP === */
        .draggable-item.dragging { opacity: 0; }
        .placeholder { height: 50px; margin-bottom: -15px; background: #f1f5f9; border: 2px dashed #94a3b8; border-radius: 8px; z-index: 0; }

        /* === BOTTONI "ADD" GLOBALI === */
        .add-btn {
            width: 40px; height: 40px; border-radius: 50%; background-color: var(--blue, #2d3e50); color: white;
            font-size: 26px; font-weight: bold; line-height: 0; display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .add-btn:hover { transform: scale(1.1); background-color: var(--charcoal); }
        
        .add-section-wrapper {
            min-width: 320px; width: 320px; display: flex; justify-content: center; align-items: center;
            border: 2px dashed #cbd5e1; border-radius: 12px; background: rgba(248, 250, 252, 0.5); cursor: pointer; transition: all 0.2s ease; min-height: 200px;
        }
        .add-section-wrapper:hover { background: #f1f5f9; border-color: var(--blue); }

        .action-buttons { display: flex; gap: 15px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="top-bar" style="justify-content: space-between;">
            <a href="homepage.html" class="logo-link">
                <img src="../imgs/artaround/logo.png" alt="ArtAround Logo" class="logo-img" />
            </a>
            <button onclick="window.location.href='old/marketplace.html'" class="login-btn" style="background: var(--blue); color: white; border: none; padding: 8px 20px; width: auto; font-size: 0.95rem;">Torna al Marketplace</button>
        </header>

        <main style="padding: 20px;">
            <div class="visit-editor-wrapper">
                <h2 class="title" style="color: var(--blue); margin-top: 0; font-size: 2rem;">Costruttore Visita</h2>
                <h3 style="margin-top: 0; margin-bottom: 25px; color: #64748b; font-size: 1rem; font-weight: normal;">
                    Stai creando una visita per: <strong id="display-museum-name" style="color: var(--charcoal);">...</strong>
                </h3>

                <div class="visit-meta-form">
                    <div><input type="text" id="v-title" placeholder="Es. Capolavori del Rinascimento (Titolo Visita)..." required /></div>
                    <div><textarea id="v-desc" rows="2" placeholder="Descrizione o introduzione generale alla visita..."></textarea></div>
                </div>

                <div class="blocks-wrapper" id="blocks-container">
                    <div class="add-section-wrapper" id="add-block-btn">
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
                            <button class="add-btn">+</button>
                            <span style="color: var(--charcoal); font-weight: bold; font-size: 1.1rem;">Aggiungi Sezione</span>
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button id="cancel-btn" class="login-btn" style="background: transparent; color: #e74c3c; border-color: #e74c3c; width: 25%; font-size: 1.1rem;">Annulla / Esci</button>
                    <button id="save-visit-btn" class="login-btn" style="width: 75%; padding: 15px; font-size: 1.1rem; background-color: #27ae60; border: none;">Salva nel Database</button>
                </div>
            </div>
        </main>
    </div>

    <div id="select-item-modal" class="modal-overlay hidden">
        <div class="modal-content auth-form">
            <h3 class="subtitle" style="margin-top: 0;">Scegli un'opera</h3>
            <div id="items-container" style="max-height: 400px; overflow-y: auto; margin: 15px 0;"></div>
            <button type="button" class="login-btn" id="close-item-modal" style="width: 100%; border-color: #cbd5e1; color: #64748b; background: transparent;">Chiudi</button>
        </div>
    </div>

    <div id="cancel-confirm-modal" class="modal-overlay hidden">
        <div class="modal-content auth-form" style="text-align: center; max-width: 450px;">
            <h2 style="color: #e74c3c; margin-top: 0;">Attenzione!</h2>
            <p style="color: var(--charcoal); font-size: 1.1rem; margin-bottom: 25px;">
                Stai per uscire dall'editor. Le modifiche non salvate andranno perse. Vuoi salvare la visita prima di abbandonare la pagina?
            </p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button id="confirm-save-btn" class="login-btn" style="background: #27ae60; border: none; font-size: 1.1rem;">Salva Visita</button>
                <button id="confirm-exit-btn" class="login-btn" style="background: #e74c3c; border: none; font-size: 1.1rem;">Esci senza salvare</button>
                <button id="close-cancel-modal" class="login-btn" style="background: transparent; color: #64748b; border: 1px solid #cbd5e1;">Continua a modificare</button>
            </div>
        </div>
    </div>

    <script src="create-visit.js"></script>
</body>
</html>
