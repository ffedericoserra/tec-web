<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround ~ Register</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main-container">
      <header class="top-bar">
        <a href="homepage.html" class="logo-link">
          <img
            src="../imgs/artaround/logo.png"
            alt="ArtAround Logo"
            class="logo-img"
          />
        </a>
      </header>

      <main class="center-content">
        <h1 class="title">ArtAround</h1>
        <h2 class="subtitle">Create a New Account</h2>

        <form id="login-form">
          <label for="username">Username:</label>
          <input class="input-slot" id="reg-username" type="text" required />

          <label for="email">Email:</label>
          <input class="input-slot" id="reg-email" type="email" required />

          <label for="pwd">Password:</label>
          <input class="input-slot" id="reg-pwd" type="password" required />

          <button class="main-btn" type="submit">Sign Up</button>

          <div id="error-msg"></div>
        </form>

        <p style="margin-top: 20px">
          <a
            href="loginpage.html"
            style="color: var(--charcoal); font-weight: bold"
            >Already have an account? Log in</a
          >
        </p>
      </main>
    </div>
    <script src="register.js"></script>
  </body>
</html>
