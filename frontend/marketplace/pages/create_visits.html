<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Editor visita</title>
    <link rel="stylesheet" href="../stylesheets/navbar.css" />
    <link rel="stylesheet" href="../stylesheets/create_visit.css" />
  </head>
  <body id="artaround-visit-editor">
    <header class="top-nav editorial-nav"><div class="nav-wrapper"></div></header>
    <main class="editor-shell">
      <section class="editor-heading">
        <a id="back-link" href="visits_list.html" class="back-link">Le mie visite</a>
        <span class="kicker">Editor visita</span>
        <h1 id="editor-title">Crea una visita</h1>
        <p>Una sola sequenza di contenuti, pronta per il Navigator.</p>
      </section>

      <section class="editor-form">
        <div class="museum-context">Museo: <strong id="museum-name">—</strong></div>
        <div class="fields-grid">
          <label><span>Titolo</span><input id="visit-title" type="text" maxlength="200" /></label>
          <label><span>Approfondimento</span>
            <select id="visit-length"><option value="quick">Rapida</option><option value="normal">Normale</option><option value="deep">Approfondita</option></select>
          </label>
          <label class="wide"><span>Introduzione</span><textarea id="visit-description" rows="3"></textarea></label>
          <label class="toggle-field"><input id="visit-public" type="checkbox" /><span>Visita pubblica</span></label>
          <label class="toggle-field"><input id="group-visit" type="checkbox" /><span>Visita di gruppo</span></label>
        </div>

        <section class="sequence-section">
          <div class="section-heading">
            <div><span class="kicker">Contenuti</span><h2>Sequenza della visita</h2></div>
            <button id="add-content-btn" class="primary-btn" type="button">Aggiungi contenuto</button>
          </div>
          <div id="sequence-list" class="sequence-list"></div>
        </section>

        <section id="quiz-section" class="quiz-section hidden">
          <div class="section-heading">
            <div><span class="kicker">Visita di gruppo</span><h2>Quiz finale</h2></div>
            <button id="add-question-btn" class="secondary-btn" type="button">Aggiungi domanda</button>
          </div>
          <p class="section-help">Il quiz sarà disponibile alla fine della sessione sincronizzata.</p>
          <div id="quiz-list" class="quiz-list"></div>
        </section>

        <div id="editor-feedback" class="feedback" aria-live="polite"></div>
        <div class="form-actions">
          <a class="secondary-btn" href="visits_list.html" id="cancel-link">Annulla</a>
          <button class="primary-btn" id="save-visit-btn" type="button">Salva visita</button>
        </div>
      </section>
    </main>

    <div id="content-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="content-modal-title">
      <div class="modal-content">
        <div class="modal-heading">
          <div><span class="kicker" id="modal-step-label">1 / 2</span><h2 id="content-modal-title">Scegli un contenuto</h2></div>
          <button id="close-content-modal" class="icon-btn" type="button" aria-label="Chiudi">&times;</button>
        </div>
        <button id="back-to-contents" class="text-btn hidden" type="button">← Torna ai contenuti</button>
        <div id="content-picker" class="content-picker"></div>
      </div>
    </div>

    <script src="../scripts/navbar.js"></script>
    <script src="../scripts/create_visit.js"></script>
  </body>
</html>
