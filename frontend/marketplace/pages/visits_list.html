<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace</title>
    <link rel="stylesheet" href="../stylesheets/styles.css" />
  </head>
  <body>
    <div class="main-container">
      <header class="top-bar">
        <a href="homepage.html" class="logo-link">
          <img
            src="../assets/artaround/logo.png"
            alt="ArtAround Logo"
            class="logo-img"
          />
        </a>

        <div style="display: flex; align-items: center; gap: 15px">
          <span class="about-text" style="margin: 0">Add a new visit</span>
          <button id="add-visit-btn" class="add-btn">+</button>
        </div>
      </header>

      <main class="center-content">
        <h1 class="title">Museo</h1>
        <h2 class="subtitle">Start, edit or add a new visit</h2>
        <div class="search-container">
          <input
            type="text"
            id="search-bar"
            class="input-slot search-bar-input"
            placeholder="Search for an artistic movement, an author or a period..."
          />
        </div>
        <div id="tours-list"></div>
      </main>

      <footer class="bottom-bar"></footer>
    </div>

    <script src="../scripts/visits_list.js"></script>
  </body>
</html>
