<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace</title>
    <link rel="stylesheet" href="../stylesheets/styles.css" />
  </head>
  <body>
    <div class="main-container">
      <header
        class="top-bar space-between"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <a href="homepage.html" class="logo-link">
          <img
            src="../assets/artaround/logo.png"
            alt="ArtAround Logo"
            class="logo-img"
          />
        </a>

        <div class="dropdown-wrapper">
          <button class="menu-btn" aria-label="Open Menu" id="main-menu-btn">
            &#9776;
          </button>

          <div id="dropdown-menu" class="dropdown-content">
            <a href="../../user_profile/pages/profile.html"
              >Your user profile</a
            >
            <p class="dropdown-label">Language settings</p>
            <a href="#">🇮🇹 Italiano</a>
            <a href="#">🇬🇧 English</a>
            <a href="#" id="logout-btn" class="logout-text">Logout</a>
          </div>
        </div>
      </header>

      <main class="center-content">
        <h1 class="title">Museo</h1>
        <h2 class="subtitle">Start, edit or add a new visit</h2>
        <div class="search-container">
          <input
            type="text"
            id="search-bar"
            class="input-slot search-bar-input"
            placeholder="Search for an artistic movement, an author or a period..."
          />
        </div>
        <div id="tours-list"></div>
      </main>

      <footer class="bottom-bar"></footer>
    </div>

    <button
      class="floating-add-btn add-btn"
      id="add-visit-btn"
      aria-label="Add a new visit"
    >
      +
    </button>
    <script src="../scripts/visits_list.js"></script>
  </body>
</html>
