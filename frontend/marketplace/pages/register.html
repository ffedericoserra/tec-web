<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Register</title>
    <link rel="stylesheet" href="../stylesheets/navbar.css" />
    <link rel="stylesheet" href="../stylesheets/styles.css" />
    <link rel="stylesheet" href="../stylesheets/register.css" />
  </head>
  <body id="artaround-register" class="register-body">
    <header class="top-nav editorial-nav">
      <div class="nav-wrapper">
        <a href="homepage.html" class="brand">
          <span class="logo-text">A&alpha;</span>
        </a>

        <ul class="nav-links">
          <li><a href="homepage.html#destinazioni" id="nav-plan">Plan your visit</a></li>
          <li><a href="#" id="nav-add-museum">Add museum</a></li>
          <li><a href="about.html" id="nav-about">About us</a></li>
        </ul>

        <div class="nav-auth-wrapper">
          <ul class="nav-auth">
            <li class="guest-only"><a href="login.html">Login</a></li>
            <li class="guest-only"><a href="register.html" class="active">Sign-up</a></li>
            <li class="user-only hidden"><a href="user_profile.html">Account</a></li>
            <li class="user-only hidden"><a href="#" id="logout-btn">Log out</a></li>
          </ul>
        </div>
      </div>
    </header>

    <main class="register-page-shell">
      <section class="register-hero">
        <div class="page-grid-lines">
          <div class="grid-line line-25"></div>
          <div class="grid-line line-50"></div>
          <div class="grid-line line-75"></div>
        </div>

        <div class="shape-circle circle-small"></div>
        <div class="shape-circle circle-large"></div>

        <div class="register-layout">
          <section class="register-heading-block">
            <span class="register-kicker">Nuovo account</span>
            <h1 class="register-title">
              <span class="font-light">JOIN</span><br />
              <span class="burgundy-text">ARTAROUND.</span>
            </h1>
            <p class="register-copy">
              Crea il tuo profilo per costruire tour, salvare percorsi e organizzare nuove visite.
            </p>
          </section>

          <section class="register-panel" aria-labelledby="register-panel-title">
            <div class="register-panel-header">
              <span class="text-label">Account</span>
              <h2 id="register-panel-title">Sign up</h2>
            </div>

            <form id="register-form" class="register-form">
              <div class="input-group">
                <label for="reg-username" class="text-label">Username</label>
                <input
                  class="input-slot"
                  id="reg-username"
                  type="text"
                  autocomplete="username"
                  required
                />
              </div>

              <div class="input-group">
                <label for="reg-email" class="text-label">Email</label>
                <input
                  class="input-slot"
                  id="reg-email"
                  type="email"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="input-group">
                <label for="reg-pwd" class="text-label">Password</label>
                <input
                  class="input-slot"
                  id="reg-pwd"
                  type="password"
                  autocomplete="new-password"
                  required
                />
              </div>

              <button class="main-btn" type="submit">Sign up</button>

              <div id="error-msg" class="register-message" aria-live="polite"></div>
            </form>

            <p class="login-prompt">
              <span>Already have an account?</span>
              <a href="login.html">Log in</a>
            </p>
          </section>
        </div>
      </section>
    </main>

    <script src="../scripts/navbar.js"></script>
    <script src="../scripts/register.js"></script>
  </body>
</html>
