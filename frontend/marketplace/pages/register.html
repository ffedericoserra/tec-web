<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround ~ Register</title>
    <link rel="stylesheet" href="../stylesheets/styles.css" />
  </head>
  <body>
    <!-- Navbar Universale -->
    <header class="top-nav">
      <div class="nav-wrapper">
        <a href="homepage.html" class="brand"
          ><span class="logo-text">A&alpha;</span></a
        >
        <ul class="nav-links">
          <li><a href="homepage.html" id="nav-plan">Plan your visit</a></li>
          <li><a href="#" id="nav-add-museum">Add a museum</a></li>
          <li><a href="about.html" id="nav-about">About us</a></li>
        </ul>
        <ul class="nav-auth">
          <li class="guest-only"><a href="login.html">Login</a></li>
          <li class="guest-only"><a href="register.html">Sign-up</a></li>
          <li class="user-only hidden">
            <a href="user_profile.html">Your Account</a>
          </li>
          <li class="user-only hidden">
            <a href="#" id="logout-btn">Log out</a>
          </li>
        </ul>
      </div>
    </header>

    <div class="main-container">
      <main class="center-content">
        <h1 class="title" style="margin-top: 40px">ArtAround</h1>
        <h2 class="subtitle">Create a New Account</h2>

        <form id="login-form">
          <label for="username">Username:</label>
          <input class="input-slot" id="reg-username" type="text" required />

          <label for="email">Email:</label>
          <input class="input-slot" id="reg-email" type="email" required />

          <label for="pwd">Password:</label>
          <input class="input-slot" id="reg-pwd" type="password" required />

          <button class="main-btn" type="submit">Sign Up</button>

          <div id="error-msg"></div>
        </form>

        <p style="margin-top: 20px">
          <a href="login.html" style="color: var(--charcoal); font-weight: bold"
            >Already have an account? Log in</a
          >
        </p>
      </main>
    </div>

    <script src="../scripts/navbar.js"></script>
    <script src="../scripts/register.js"></script>
  </body>
</html>
