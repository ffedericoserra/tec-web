<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Home</title>
    <link rel="stylesheet" href="../stylesheets/styles.css" />
  </head>
  <body>
    <div class="main-container">
      <header class="top-nav">
        <div class="nav-wrapper">
          <a href="homepage.html" class="brand"><span class="logo-text">A&alpha;</span></a>
          <ul class="nav-links">
            <li><a href="museums_list.html">Plan your visit</a></li>
            <li><a href="museums_list.html">Add a museum</a></li>
            <li><a href="#about-section">About us</a></li>
          </ul>
          <ul class="nav-auth">
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Sign-up</a></li>
            <li id="logout-item" class="hidden"><a href="#" onclick="handleLogout()">Logout</a></li>
          </ul>
        </div>
      </header>

      <main class="center-content">
        <h1 class="title">ArtAround</h1>
        <h2 class="subtitle">Your personal museum guide</h2>
        <div style="display: flex; gap: 20px; justify-content: center; margin-top: 20px;">
          <button class="main-btn" onclick="window.location.href = './login.html'">Login</button>
          <button class="secondary-btn" onclick="window.location.href = './register.html'">Sign up</button>
        </div>
      </main>

      <footer class="bottom-bar" id="about-section">
        <div class="about-text">About</div>
        <div class="arrow" id="about-arrow">&darr;</div>
      </footer>
    </div>
    
    <div class="hidden-text" style="display:none; padding: 40px; line-height: 1.6;">
       <p><strong>ArtAround</strong> is a web application made for exploring museums... (Unibo 2025/26)</p>
    </div>

    <script src="../scripts/navbar.js"></script>
    <script>
      document.getElementById("about-arrow").onclick = () => {
        const target = document.querySelector(".hidden-text");
        target.style.display = "block";
        target.scrollIntoView({ behavior: "smooth" });
      };
    </script>
  </body>
</html>
