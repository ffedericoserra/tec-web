<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround</title>
    <link rel="stylesheet" href="../stylesheets/navbar.css" />
    <link rel="stylesheet" href="../stylesheets/homepage.css" />
  </head>
  <body id="artaround-home" class="home-body">
    <header class="top-nav editorial-nav"><div class="nav-wrapper"></div></header>
    <main>
      <section class="hero-editorial">
        <div class="page-grid-lines" aria-hidden="true">
          <div class="grid-line line-25"></div>
          <div class="grid-line line-50"></div>
          <div class="grid-line line-75"></div>
        </div>
        <div class="shape-circle circle-small"></div>
        <div class="shape-circle circle-large"></div>
        <div class="hero-left-content">
          <div class="hero-text-inner">
            <h1 class="hero-title">
              <span class="font-light">LA</span> FORMA<br />
              <span class="burgundy-text">DELL'ARTE.</span>
            </h1>
            <p class="hero-description">
              Crea descrizioni e percorsi museali, raccogli gli item che preferisci
              e porta la tua visita nel Navigator.
            </p>
            <div class="hero-actions">
              <button class="primary-btn" type="button" onclick="window.location.href='visits_list.html'">
                Le mie visite
              </button>
            </div>
          </div>
        </div>
        <div class="hero-right-content">
          <img src="../assets/artaround/image-17.png" alt="Nike di Samotracia" class="hero-statue" />
          <p class="vertical-text right-vertical">NIKE DI SAMOTRACIA 190 a.C.</p>
        </div>
      </section>
    </main>
    <script src="../scripts/navbar.js"></script>
  </body>
</html>
