<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Account</title>
    <link rel="stylesheet" href="../stylesheets/navbar.css" />
    <link rel="stylesheet" href="../stylesheets/user_profile.css" />
  </head>
  <body id="artaround-account">
    <header class="top-nav editorial-nav"><div class="nav-wrapper"></div></header>
    <main>
      <section class="account-heading">
        <span class="kicker">Area personale</span>
        <h1>Account</h1>
        <p>Profilo, wallet, visite create e preferiti in un'unica area personale.</p>
      </section>
      <section class="account-workspace">
        <article class="profile-card">
          <img id="profile-avatar" src="/uploads/profiles/default-avatar.jpeg" alt="Avatar utente" />
          <div><span class="label">Username</span><h2 id="profile-username">Caricamento...</h2></div>
          <div><span class="label">Email</span><p id="profile-email">—</p></div>
        </article>
        <article class="wallet-card">
          <span class="label">Wallet</span>
          <p class="balance"><strong id="wallet-balance">0</strong> A&alpha;</p>
          <p>Il credito viene usato per acquistare Item dal marketplace.</p>
          <form id="wallet-form">
            <label for="wallet-amount"><span class="label">Importo ricarica</span><input id="wallet-amount" type="number" min="1" step="1" value="10" /></label>
            <button class="primary-btn" type="submit">Ricarica</button>
          </form>
          <div id="account-feedback" class="feedback" aria-live="polite"></div>
        </article>
        <section class="account-library" aria-labelledby="account-library-title">
          <div class="account-library-heading">
            <div>
              <span class="label">La tua raccolta</span>
              <h2 id="account-library-title">Visite e preferiti</h2>
            </div>
            <a class="secondary-btn" href="visits_list.html">Gestisci le visite</a>
          </div>
          <div class="account-library-grid">
            <article>
              <h3>Le mie visite</h3>
              <div id="account-visits" class="account-list"></div>
            </article>
            <article>
              <h3>Preferiti</h3>
              <div id="account-favorites" class="account-list"></div>
            </article>
          </div>
        </section>
      </section>
    </main>
    <script src="../scripts/navbar.js"></script>
    <script src="../scripts/user_profile.js"></script>
  </body>
</html>
