<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace - ArtAround</title>
    <link rel="stylesheet" href="../stylesheets/styles.css" />
  </head>
  <body>
    <div class="main-container">
      <header
        class="top-bar space-between"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <a href="homepage.html" class="logo-link">
          <img
            src="../assets/artaround/logo.png"
            alt="ArtAround Logo"
            class="logo-img"
          />
        </a>

        <div class="dropdown-wrapper">
          <button class="menu-btn" aria-label="Open Menu" id="main-menu-btn">
            &#9776;
          </button>

          <div id="dropdown-menu" class="dropdown-content">
            <a href="../../user_profile/pages/profile.html"
              >Your user profile</a
            >
            <p class="dropdown-label">Language settings</p>
            <a href="#">🇮🇹 Italiano</a>
            <a href="#">🇬🇧 English</a>
            <a href="#" id="logout-btn" class="logout-text">Logout</a>
          </div>
        </div>
      </header>

      <main class="center-content">
        <h1 class="title">Marketplace</h1>
        <h2 class="subtitle">Select an existing museum or add a new one</h2>

        <div class="search-container">
          <input
            type="text"
            id="search-bar"
            class="input-slot search-bar-input"
            placeholder="Search for a museum or a city..."
          />
        </div>

        <div id="museum-list"></div>
      </main>

      <footer class="bottom-bar"></footer>
    </div>

    <div id="add-museum-modal" class="modal-overlay hidden">
      <div class="modal-content auth-form">
        <h2
          class="subtitle"
          style="margin-top: 0; color: var(--charcoal, #333)"
        >
          Add New Museum
        </h2>
        <form id="add-museum-form">
          <div class="input-group">
            <label for="m-name">Museum Name *</label>
            <input type="text" id="m-name" required />
          </div>
          <div class="input-group">
            <label for="m-address">Address</label>
            <input type="text" id="m-address" />
          </div>
          <div class="input-group">
            <label for="m-description">Description</label>
            <textarea
              id="m-description"
              rows="3"
              class="modal-textarea"
            ></textarea>
          </div>

          <div id="add-modal-error" class="error-message"></div>

          <div class="form-actions">
            <button
              type="button"
              class="main-btn cancel-btn"
              id="cancel-add-btn"
            >
              Cancel
            </button>
            <button type="submit" class="main-btn">Save</button>
          </div>
        </form>
      </div>
    </div>

    <button
      class="floating-add-btn add-btn"
      id="add-museum-btn"
      aria-label="Add a new museum"
    >
      +
    </button>

    <script src="../scripts/museums_list.js"></script>
  </body>
</html>
