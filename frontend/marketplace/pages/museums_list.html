<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace - ArtAround</title>
    <link rel="stylesheet" href="../stylesheets/styles.css" />
  </head>
  <body>
    <!-- NUOVA NAVBAR UNIFICATA -->
    <header class="top-nav">
      <div class="nav-wrapper">
        <a href="homepage.html" class="brand">
          <span class="logo-text">A&alpha;</span>
        </a>

        <ul class="nav-links">
          <li>
            <a href="museums_list.html" class="active">Plan your visit</a>
          </li>
          <!-- Questo link può attivare il modale add-museum tramite JS -->
          <li><a href="#" id="nav-add-museum">Add a museum</a></li>
          <li><a href="homepage.html#about-section">About us</a></li>
        </ul>

        <ul class="nav-auth">
          <li><a href="user_profile.html">Your Account</a></li>
          <li id="logout-item">
            <a href="#" onclick="handleLogout()" class="logout-text">Logout</a>
          </li>
        </ul>
      </div>
    </header>

    <div class="main-container">
      <main class="center-content">
        <h1 class="title">Marketplace</h1>
        <h2 class="subtitle">Select an existing museum or add a new one</h2>

        <div class="search-container">
          <input
            type="text"
            id="search-bar"
            class="input-slot search-bar-input"
            placeholder="Search for a museum or a city..."
          />
        </div>

        <div id="museum-list"></div>
      </main>

      <footer class="bottom-bar"></footer>
    </div>

    <!-- MODALE AGGIUNTA MUSEO (Invariato) -->
    <div id="add-museum-modal" class="modal-overlay hidden">
      <div class="modal-content auth-form">
        <h2
          class="subtitle"
          style="margin-top: 0; color: var(--charcoal, #333)"
        >
          Add New Museum
        </h2>
        <form id="add-museum-form">
          <div class="input-group">
            <label for="m-name">Museum Name *</label>
            <input type="text" id="m-name" required />
          </div>
          <div class="input-group">
            <label for="m-address">Address</label>
            <input type="text" id="m-address" />
          </div>
          <div class="input-group">
            <label for="m-description">Description</label>
            <textarea
              id="m-description"
              rows="3"
              class="modal-textarea"
            ></textarea>
          </div>
          <div id="add-modal-error" class="error-message"></div>
          <div class="form-actions">
            <button
              type="button"
              class="main-btn cancel-btn"
              id="cancel-add-btn"
            >
              Cancel
            </button>
            <button type="submit" class="main-btn">Save</button>
          </div>
        </form>
      </div>
    </div>

    <button
      class="floating-add-btn add-btn"
      id="add-museum-btn"
      aria-label="Add a new museum"
    >
      +
    </button>

    <!-- Script della Navbar per gestire il Logout -->
    <script src="../scripts/navbar.js"></script>
    <!-- Tuo script originale per la logica dei musei -->
    <script src="../scripts/museums_list.js"></script>

    <script>
      // Opzionale: Collega il link della navbar al modale già esistente
      const navAddBtn = document.getElementById("nav-add-museum");
      const mainAddBtn = document.getElementById("add-museum-btn");
      if (navAddBtn && mainAddBtn) {
        navAddBtn.addEventListener("click", (e) => {
          e.preventDefault();
          mainAddBtn.click();
        });
      }
    </script>
  </body>
</html>
