<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Editorial Item Edit</title>
    <!-- Fogli di stile -->
    <link rel="stylesheet" href="../stylesheets/navbar.css">
    <link rel="stylesheet" href="../stylesheets/create_items.css" />
  </head>
  
  <body id="artaround-item-edit">

    <!-- NAVBAR FISSA -->
    <header class="top-nav editorial-nav">
      <div class="nav-wrapper">
        <a href="homepage.html" class="brand">
          <span class="logo-text">A&alpha;</span>
        </a>
        <ul class="nav-links">
          <li><a href="homepage.html#destinazioni">Plan your visit</a></li>
          <li><a href="add_museum.html">Add museum</a></li>
          <li><a href="about.html">About us</a></li>
        </ul>
        <div class="nav-auth-wrapper">
            <ul class="nav-auth">
                <li class="user-only"><a href="user_profile.html">Account</a></li>
                <li class="user-only"><a href="#" id="logout-btn">Log out</a></li>
            </ul>
        </div>
      </div>
    </header>

    <main class="item-edit-container">
        
        <!-- INTESTAZIONE GIGANTE TIPO HOMEPAGE -->
        <div class="editorial-header-section">
            <div class="museum-context-info">
                MUSEO / <span id="museum-name-display" class="burgundy-text">CARICAMENTO...</span>
            </div>
            <h1 class="artwork-title" id="artwork-title-display">CARICAMENTO OPERA...</h1>
        </div>

        <!-- DROPDOWN CUSTOM MINIMALE -->
        <div class="custom-dropdown-container">
            <div class="dropdown-trigger" id="dropdown-trigger">
                <span id="dropdown-selected-text" class="dropdown-label">Select (and edit) an existing item or create a new one</span> 
                <span class="arrow">▼</span>
            </div>
            
            <div class="dropdown-menu hidden" id="dropdown-menu">
                <ul id="existing-items-list">
                    <!-- Iniettati da JS -->
                </ul>
                <div class="dropdown-action">
                    <button id="btn-create-new" class="create-new-btn">Crea il tuo item (Nuovo)</button>
                </div>
            </div>
        </div>

        <div class="item-editor-grid">
            
            <!-- COLONNA SINISTRA: IMMAGINE E METADATI A RIGHE -->
            <div class="item-image-col">
                <div class="image-placeholder" id="image-preview">
                    <img
                      src="/uploads/contents/placeholder.jpg"
                      alt="Immagine placeholder"
                      class="image-preview-img"
                    />
                </div>
                <div class="item-metadata">
                    <div class="meta-row">
                        <span class="meta-label">ANNO</span>
                        <input type="text" id="item-anno" class="readonly-input" readonly>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">PREZZO</span>
                        <input type="text" id="item-prezzo" class="readonly-input" readonly>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">AUTORE ITEM</span>
                        <input type="text" id="item-creatore" class="readonly-input" readonly>
                    </div>
                </div>
            </div>

            <!-- COLONNA DESTRA: ACCORDION EDITORIALI -->
            <div class="item-content-col">
                
                <div class="audience-section">
                    <button
                      type="button"
                      class="audience-header"
                      data-aud="children"
                      aria-expanded="false"
                      aria-controls="audience-panel-children"
                    >
                        <span>PER BAMBINI</span>
                        <span class="arrow-icon" id="arrow-children">▼</span>
                    </button>
                    <div class="audience-panel hidden" id="audience-panel-children">
                        <div class="duration-tabs" role="tablist" aria-label="Durata descrizione per bambini">
                            <button type="button" class="duration-tab" data-duration="3s" role="tab" aria-selected="false" aria-controls="text-children-3s">3 SEC</button>
                            <button type="button" class="duration-tab is-active" data-duration="15s" role="tab" aria-selected="true" aria-controls="text-children-15s">15 SEC</button>
                            <button type="button" class="duration-tab" data-duration="45s" role="tab" aria-selected="false" aria-controls="text-children-45s">45 SEC</button>
                        </div>
                        <textarea id="text-children-3s" class="audience-textarea hidden" data-duration="3s" role="tabpanel" placeholder="Scrivi una descrizione per bambini da 3 secondi..."></textarea>
                        <textarea id="text-children-15s" class="audience-textarea" data-duration="15s" role="tabpanel" placeholder="Scrivi una descrizione per bambini da 15 secondi..."></textarea>
                        <textarea id="text-children-45s" class="audience-textarea hidden" data-duration="45s" role="tabpanel" placeholder="Scrivi una descrizione per bambini da 45 secondi..."></textarea>
                    </div>
                </div>

                <!-- STANDARD -->
                <div class="audience-section">
                    <button
                      type="button"
                      class="audience-header"
                      data-aud="standard"
                      aria-expanded="true"
                      aria-controls="audience-panel-standard"
                    >
                        <span>STANDARD</span>
                        <span class="arrow-icon open" id="arrow-standard">▼</span>
                    </button>
                    <div class="audience-panel" id="audience-panel-standard">
                        <div class="duration-tabs" role="tablist" aria-label="Durata descrizione standard">
                            <button type="button" class="duration-tab" data-duration="3s" role="tab" aria-selected="false" aria-controls="text-standard-3s">3 SEC</button>
                            <button type="button" class="duration-tab is-active" data-duration="15s" role="tab" aria-selected="true" aria-controls="text-standard-15s">15 SEC</button>
                            <button type="button" class="duration-tab" data-duration="45s" role="tab" aria-selected="false" aria-controls="text-standard-45s">45 SEC</button>
                        </div>
                        <textarea id="text-standard-3s" class="audience-textarea hidden" data-duration="3s" role="tabpanel" placeholder="Scrivi una descrizione standard da 3 secondi..."></textarea>
                        <textarea id="text-standard-15s" class="audience-textarea" data-duration="15s" role="tabpanel" placeholder="Scrivi una descrizione standard da 15 secondi..."></textarea>
                        <textarea id="text-standard-45s" class="audience-textarea hidden" data-duration="45s" role="tabpanel" placeholder="Scrivi una descrizione standard da 45 secondi..."></textarea>
                    </div>
                </div>

                <div class="audience-section">
                    <button
                      type="button"
                      class="audience-header"
                      data-aud="expert"
                      aria-expanded="false"
                      aria-controls="audience-panel-expert"
                    >
                        <span>PER ESPERTI</span>
                        <span class="arrow-icon" id="arrow-expert">▼</span>
                    </button>
                    <div class="audience-panel hidden" id="audience-panel-expert">
                        <div class="duration-tabs" role="tablist" aria-label="Durata descrizione per esperti">
                            <button type="button" class="duration-tab" data-duration="3s" role="tab" aria-selected="false" aria-controls="text-expert-3s">3 SEC</button>
                            <button type="button" class="duration-tab is-active" data-duration="15s" role="tab" aria-selected="true" aria-controls="text-expert-15s">15 SEC</button>
                            <button type="button" class="duration-tab" data-duration="45s" role="tab" aria-selected="false" aria-controls="text-expert-45s">45 SEC</button>
                        </div>
                        <textarea id="text-expert-3s" class="audience-textarea hidden" data-duration="3s" role="tabpanel" placeholder="Scrivi una descrizione per esperti da 3 secondi..."></textarea>
                        <textarea id="text-expert-15s" class="audience-textarea" data-duration="15s" role="tabpanel" placeholder="Scrivi una descrizione per esperti da 15 secondi..."></textarea>
                        <textarea id="text-expert-45s" class="audience-textarea hidden" data-duration="45s" role="tabpanel" placeholder="Scrivi una descrizione per esperti da 45 secondi..."></textarea>
                    </div>
                </div>

            </div>
        </div>

        <!-- AZIONI FINALI: BOTTONI SQUADRATI -->
        <div class="item-actions">
            <!-- Il bottone elimina è rosso e nascosto di default -->
            <button id="btn-delete-item" class="secondary-btn hidden" type="button">Elimina il mio Item</button>
            
            <button id="btn-cancel-exit" class="secondary-btn">Annulla</button>
            <button id="btn-save-exit" class="primary-btn">Salva Item Pubblico</button>
        </div>

    </main>

    <!-- POP-UP -->
    <div id="toast-container"></div>

    <!-- SCRIPT -->
    <script src="../scripts/navbar.js"></script>
    <script src="../scripts/create_item.js"></script>
  </body>
</html>
