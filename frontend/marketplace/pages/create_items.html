<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/artaround/logo.png" />
    <title data-i18n="itemEditor.title">ArtAround - Editor Item</title>
    <!-- Fogli di stile -->
    <link rel="stylesheet" href="../stylesheets/navbar.css">
    <link rel="stylesheet" href="../stylesheets/create_items.css" />
    <link rel="stylesheet" href="../stylesheets/responsive.css" />
  </head>
  
  <body id="artaround-item-edit">

    <!-- NAVBAR FISSA -->
    <header class="top-nav editorial-nav"><div class="nav-wrapper"></div></header>

    <main class="item-edit-container">
        
        <!-- INTESTAZIONE GIGANTE TIPO HOMEPAGE -->
        <div class="editorial-header-section">
            <div class="page-grid-lines">
                <div class="grid-line line-25"></div>
                <div class="grid-line line-50"></div>
                <div class="grid-line line-75"></div>
            </div>
            <div class="shape-circle circle-small"></div>
            <div class="shape-circle circle-large"></div>

            <div class="museum-context-info">
                <span data-i18n="itemEditor.museumPrefix">MUSEO /</span> <span id="museum-name-display" class="burgundy-text">CARICAMENTO...</span>
            </div>
            <h1 class="artwork-title" id="artwork-title-display">CARICAMENTO OPERA...</h1>
        </div>

        <!-- DROPDOWN CUSTOM MINIMALE -->
        <div class="custom-dropdown-container">
            <div class="dropdown-trigger" id="dropdown-trigger">
                <span id="dropdown-selected-text" class="dropdown-label">Seleziona e modifica un Item esistente oppure creane uno nuovo</span>
                <span class="arrow">▼</span>
            </div>
            
            <div class="dropdown-menu hidden" id="dropdown-menu">
                <ul id="existing-items-list">
                    <!-- Iniettati da JS -->
                </ul>
                <div class="dropdown-action">
                    <button id="btn-create-new" class="create-new-btn" data-i18n="itemEditor.createOwn">Crea il tuo Item (nuovo)</button>
                </div>
            </div>
        </div>

        <div class="item-editor-grid">
            
            <!-- COLONNA SINISTRA: IMMAGINE E METADATI A RIGHE -->
            <div class="item-image-col">
                <div class="image-placeholder" id="image-preview">
                    <img
                      src="/uploads/placeholders/template-no-image.jpg"
                      alt="Immagine segnaposto"
                      data-i18n-alt="itemEditor.placeholderAlt"
                      class="image-preview-img"
                    />
                </div>
                <div class="item-metadata">
                    <div class="meta-row">
                        <label class="meta-label" for="item-license" data-i18n="itemEditor.license">LICENZA</label>
                        <select id="item-license" class="metadata-control">
                            <option value="CC-BY">CC-BY</option>
                            <option value="CC-BY-SA">CC-BY-SA</option>
                            <option value="CC-BY-NC">CC-BY-NC</option>
                            <option value="Copyright">Copyright</option>
                            <option value="Public Domain">Public Domain</option>
                        </select>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label" data-i18n="itemEditor.itemAuthor">AUTORE ITEM</span>
                        <input type="text" id="item-creatore" class="readonly-input" readonly>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label" data-i18n="itemEditor.price">PREZZO</span>
                        <div class="meta-control-with-unit">
                            <input type="number" id="item-prezzo" class="metadata-control metadata-number" min="0" step="1" value="0">
                            <span class="meta-unit" data-i18n="common.credits">crediti</span>
                        </div>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label" data-i18n="itemEditor.publishing">PUBBLICAZIONE</span>
                        <label class="publication-toggle" for="item-is-public">
                            <input type="checkbox" id="item-is-public">
                            <span data-i18n="itemEditor.availableMarketplace">Disponibile nel marketplace</span>
                        </label>
                    </div>
                    <div class="meta-row">
                        <label class="meta-label" for="item-target-audience" data-i18n="itemEditor.target">TARGET</label>
                        <select id="item-target-audience" class="metadata-control">
                            <option value="general" data-i18n="itemEditor.audienceGeneral">Generale</option>
                            <option value="children" data-i18n="itemEditor.audienceChildren">Bambini e famiglie</option>
                            <option value="student" data-i18n="itemEditor.audienceStudents">Studenti</option>
                            <option value="expert" data-i18n="itemEditor.audienceExperts">Esperti</option>
                            <option value="tourist" data-i18n="itemEditor.audienceTourists">Turisti</option>
                        </select>
                    </div>
                </div>
                <fieldset class="associated-content-fieldset">
                    <legend data-i18n="itemEditor.optionalContents">CONTENUTI OPZIONALI</legend>
                    <div id="associated-contents-list" class="associated-contents-list"></div>
                </fieldset>
            </div>

            <!-- COLONNA DESTRA: ACCORDION EDITORIALI -->
            <div class="item-content-col">
                
                <div class="audience-section">
                    <button
                      type="button"
                      class="audience-header"
                      data-aud="children"
                      aria-expanded="false"
                      aria-controls="audience-panel-children"
                    >
                        <span class="audience-header-text">
                            <span class="audience-header-title" data-i18n="itemEditor.children">Tono semplice</span>
                            <span class="audience-header-hint" data-i18n="itemEditor.childrenHint">Lessico per bambini: frasi brevi e parole quotidiane</span>
                        </span>
                        <span class="arrow-icon" id="arrow-children">▼</span>
                    </button>
                    <div class="audience-panel hidden" id="audience-panel-children">
                        <div class="duration-tabs" role="tablist" aria-label="Durata descrizione per bambini" data-i18n-aria-label="itemEditor.durationChildrenAria">
                            <button type="button" class="duration-tab" data-duration="15s" role="tab" aria-selected="false" aria-controls="text-children-15s" data-i18n="itemEditor.seconds15">15 SEC</button>
                            <button type="button" class="duration-tab is-active" data-duration="30s" role="tab" aria-selected="true" aria-controls="text-children-30s" data-i18n="itemEditor.seconds30">30 SEC</button>
                            <button type="button" class="duration-tab" data-duration="60s" role="tab" aria-selected="false" aria-controls="text-children-60s" data-i18n="itemEditor.seconds60">60 SEC</button>
                        </div>
                        <textarea id="text-children-15s" class="audience-textarea hidden" data-duration="15s" role="tabpanel" placeholder="Scrivi una descrizione per bambini da 15 secondi..."></textarea>
                        <textarea id="text-children-30s" class="audience-textarea" data-duration="30s" role="tabpanel" placeholder="Scrivi una descrizione per bambini da 30 secondi..."></textarea>
                        <textarea id="text-children-60s" class="audience-textarea hidden" data-duration="60s" role="tabpanel" placeholder="Scrivi una descrizione per bambini da 60 secondi..."></textarea>
                    </div>
                </div>

                <!-- STANDARD -->
                <div class="audience-section">
                    <button
                      type="button"
                      class="audience-header"
                      data-aud="standard"
                      aria-expanded="true"
                      aria-controls="audience-panel-standard"
                    >
                        <span class="audience-header-text">
                            <span class="audience-header-title" data-i18n="itemEditor.standard">Tono standard</span>
                            <span class="audience-header-hint" data-i18n="itemEditor.standardHint">Lessico comune e scorrevole, adatto a tutti</span>
                        </span>
                        <span class="arrow-icon open" id="arrow-standard">▼</span>
                    </button>
                    <div class="audience-panel" id="audience-panel-standard">
                        <div class="duration-tabs" role="tablist" aria-label="Durata descrizione standard" data-i18n-aria-label="itemEditor.durationStandardAria">
                            <button type="button" class="duration-tab" data-duration="15s" role="tab" aria-selected="false" aria-controls="text-standard-15s" data-i18n="itemEditor.seconds15">15 SEC</button>
                            <button type="button" class="duration-tab is-active" data-duration="30s" role="tab" aria-selected="true" aria-controls="text-standard-30s" data-i18n="itemEditor.seconds30">30 SEC</button>
                            <button type="button" class="duration-tab" data-duration="60s" role="tab" aria-selected="false" aria-controls="text-standard-60s" data-i18n="itemEditor.seconds60">60 SEC</button>
                        </div>
                        <textarea id="text-standard-15s" class="audience-textarea hidden" data-duration="15s" role="tabpanel" placeholder="Scrivi una descrizione standard da 15 secondi..."></textarea>
                        <textarea id="text-standard-30s" class="audience-textarea" data-duration="30s" role="tabpanel" placeholder="Scrivi una descrizione standard da 30 secondi..."></textarea>
                        <textarea id="text-standard-60s" class="audience-textarea hidden" data-duration="60s" role="tabpanel" placeholder="Scrivi una descrizione standard da 60 secondi..."></textarea>
                    </div>
                </div>

                <div class="audience-section">
                    <button
                      type="button"
                      class="audience-header"
                      data-aud="expert"
                      aria-expanded="false"
                      aria-controls="audience-panel-expert"
                    >
                        <span class="audience-header-text">
                            <span class="audience-header-title" data-i18n="itemEditor.experts">Tono approfondito</span>
                            <span class="audience-header-hint" data-i18n="itemEditor.expertsHint">Lessico specialistico, riferimenti tecnici e storico-critici</span>
                        </span>
                        <span class="arrow-icon" id="arrow-expert">▼</span>
                    </button>
                    <div class="audience-panel hidden" id="audience-panel-expert">
                        <div class="duration-tabs" role="tablist" aria-label="Durata descrizione per esperti" data-i18n-aria-label="itemEditor.durationExpertsAria">
                            <button type="button" class="duration-tab" data-duration="15s" role="tab" aria-selected="false" aria-controls="text-expert-15s" data-i18n="itemEditor.seconds15">15 SEC</button>
                            <button type="button" class="duration-tab is-active" data-duration="30s" role="tab" aria-selected="true" aria-controls="text-expert-30s" data-i18n="itemEditor.seconds30">30 SEC</button>
                            <button type="button" class="duration-tab" data-duration="60s" role="tab" aria-selected="false" aria-controls="text-expert-60s" data-i18n="itemEditor.seconds60">60 SEC</button>
                        </div>
                        <textarea id="text-expert-15s" class="audience-textarea hidden" data-duration="15s" role="tabpanel" placeholder="Scrivi una descrizione per esperti da 15 secondi..."></textarea>
                        <textarea id="text-expert-30s" class="audience-textarea" data-duration="30s" role="tabpanel" placeholder="Scrivi una descrizione per esperti da 30 secondi..."></textarea>
                        <textarea id="text-expert-60s" class="audience-textarea hidden" data-duration="60s" role="tabpanel" placeholder="Scrivi una descrizione per esperti da 60 secondi..."></textarea>
                    </div>
                </div>

            </div>
        </div>

        <!-- AZIONI FINALI: BOTTONI SQUADRATI -->
        <div class="item-actions">
            <!-- Il bottone elimina è rosso e nascosto di default -->
            <button id="btn-delete-item" class="secondary-btn hidden" type="button" data-i18n="itemEditor.deleteMine">Elimina il mio Item</button>
            <button id="btn-purchase-item" class="secondary-btn hidden" type="button" data-i18n="itemEditor.purchase">Acquista Item</button>
            <button id="btn-cancel-exit" class="secondary-btn" data-i18n="common.cancel">Annulla</button>
            <button id="btn-save-exit" class="primary-btn" data-i18n="itemEditor.save">Salva Item</button>
        </div>

    </main>

    <!-- POP-UP -->
    <div id="toast-container"></div>

    <!-- SCRIPT -->
    <script src="../vendor/i18next.min.js"></script>
    <script src="../scripts/i18n.js"></script>
    <script src="../scripts/navbar.js"></script>
    <script src="../scripts/create_item.js"></script>
  </body>
</html>
