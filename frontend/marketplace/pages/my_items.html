<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/artaround/logo.png" />
    <title data-i18n="items.title">ArtAround - I miei Item</title>
    <link rel="stylesheet" href="../stylesheets/navbar.css" />
    <link rel="stylesheet" href="../stylesheets/my_items.css" />
  </head>
  <body id="artaround-my-items">
    <header class="top-nav editorial-nav"><div class="nav-wrapper"></div></header>
    <main>
      <section class="items-heading">
        <div class="page-grid-lines">
          <div class="grid-line line-25"></div>
          <div class="grid-line line-50"></div>
          <div class="grid-line line-75"></div>
        </div>
        <div class="shape-circle circle-small"></div>
        <div class="shape-circle circle-large"></div>
        <span class="kicker" data-i18n="items.kicker">Collezione</span>
        <h1 data-i18n="items.heading">I miei Item</h1>
        <p data-i18n="items.intro">Parti da un Content del museo per gestire le tue descrizioni e quelle acquistate.</p>
      </section>
      <section class="items-workspace">
        <div class="items-toolbar">
          <label><span data-i18n="common.museum">Museo</span><select id="items-museum-select"><option value="" data-i18n="items.allMuseums">Tutti i musei</option></select></label>
          <label><span data-i18n="items.search">Cerca Content</span><input id="content-search" type="search" placeholder="Titolo o autore" data-i18n-placeholder="items.searchPlaceholder" /></label>
        </div>
        <div id="items-feedback" class="feedback" aria-live="polite">Caricamento contenuti...</div>
        <div id="contents-grid" class="contents-grid"></div>
      </section>
    </main>

    <div id="content-detail" class="detail-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <section class="detail-panel">
        <div class="detail-heading">
          <div><span class="kicker" id="detail-museum"></span><h2 id="detail-title">Content</h2><p id="detail-author"></p></div>
          <button id="close-detail" class="icon-btn" type="button" aria-label="Chiudi" data-i18n-aria-label="items.closeAria">&times;</button>
        </div>
        <div class="detail-tabs" role="tablist" aria-label="Sezioni Item" data-i18n-aria-label="items.detailSectionsAria">
          <button class="tab-btn active" data-tab="marketplace" type="button" role="tab" aria-selected="true" data-i18n="items.marketplace">Marketplace</button>
          <button class="tab-btn" data-tab="mine" type="button" role="tab" aria-selected="false" data-i18n="items.mineTab">I miei Item</button>
          <button class="tab-btn" data-tab="purchased" type="button" role="tab" aria-selected="false" data-i18n="items.purchasedTab">Item acquistati</button>
        </div>
        <div id="items-detail-list" class="items-detail-list" role="tabpanel"></div>
      </section>
    </div>

    <script src="../vendor/i18next.min.js"></script>
    <script src="../scripts/i18n.js"></script>
    <script src="../scripts/navbar.js"></script>
    <script src="../scripts/my_items.js"></script>
  </body>
</html>
