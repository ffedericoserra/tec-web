<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable=no lock the zoom on Android/Chrome. iOS Safari
         has ignored user-scalable=no since iOS 10, so `touch-action` in base.css does
         the real work there. Both are needed. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f3ee" />
    <title>ArtAround</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
